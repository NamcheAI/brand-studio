name: publish

# CI-passed main images are published for the VM's local release poller.
# Runtime history, health, promotion and rollback remain host-owned.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# One group for the whole build -> release pipeline: two merges in quick
# succession serialize rather than racing each other onto the host.
concurrency:
  # Only a successful same-repo main push may share the publication queue.
  # Ineligible events cannot replace a queued main image build.
  group: image-publish-${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && 'main' || github.run_id }}
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  IMAGE: ghcr.io/namcheai/brand-studio
  # Avoid the automatic, 90-day Docker build-record artifact per deploy.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Trusted main-only OCI build of the pushed sha. This is the ONLY job that
  # gets packages:write, and it only ever builds already-merged, ci-passed main.
  build:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOYS_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (build cache read+write)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # linux/amd64 (the estate's hosts) + provenance:false -> a single image
      # manifest, so the pushed digest is unambiguous and the deploy contract's
      # `<repo>@sha256:<64 hex>` pattern always matches what shipped.
      - name: Build and push OCI image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}/buildcache:main
          cache-to: type=registry,ref=${{ env.IMAGE }}/buildcache:main,mode=max

      - name: Publish the main image channel if still current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash .github/scripts/publish-main-image.sh
