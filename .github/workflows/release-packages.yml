name: Release packages

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run release:dry-run

      - name: Publish unpublished package versions
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          # The registry read path lags its write path: a version published
          # moments earlier can still 404 for `npm view`. That made this step
          # decide a package was unpublished, try to publish it again, and fail
          # the whole release on npm's duplicate-version rejection — which is
          # what happened to @namche/metaball-svg@0.1.0.
          #
          # The pre-check stays as a cheap fast path, but it is no longer load
          # bearing: publishing a version that already exists is now treated as
          # the outcome we wanted rather than an error. That also makes the step
          # safe to re-run, and race-free if two releases overlap.
          publish_if_missing() {
            local name="$1" dir="$2" version log
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip    $name@$version — already on the registry"
              return 0
            fi

            log=$(mktemp)
            if npm publish -w "$name" --access public --provenance --tag "$NPM_TAG" >"$log" 2>&1; then
              cat "$log"
              echo "publish $name@$version — done"
              return 0
            fi

            cat "$log"
            if grep -qiE 'cannot publish over|previously published versions|EPUBLISHCONFLICT' "$log"; then
              echo "skip    $name@$version — already on the registry (the pre-check read stale data)"
              return 0
            fi

            echo "FAILED  $name@$version"
            return 1
          }

          publish_if_missing @namche/metaball core
          publish_if_missing @namche/metaball-react renderer
          publish_if_missing @namche/metaball-svg svg
